# 毎朝9時半（日本時間）に、寄付ページの支援額を data/progress.json に取り込みます。
# 手動で動かすとき：GitHub の Actions タブ →「支援額を更新」→ Run workflow
name: 支援額を更新

on:
  schedule:
    - cron: "30 0 * * *"    # UTC 0:30 = 日本時間 9:30
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/fetch_progress.py
      - name: 変わっていたらコミット
        run: |
          if git diff --quiet data/progress.json; then
            echo "変更なし"
          else
            git config user.name "hagiiz-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/progress.json
            git commit -m "支援額を更新"
            git push
          fi
